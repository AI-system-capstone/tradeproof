<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeProof 운영 화면</title>
<!-- M8 운영 화면 (현재 운영 번들, UI-01 반입, UI-02 검증·승인, 배포 상태·롤백).
     폐쇄망용: 외부 CDN·폰트·라이브러리 없이 HTML+CSS+바닐라 JS 한 파일.
     A의 담당자 검토 화면(a_screening/ui/review.html)과는 별도. -->
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1d2330; --muted:#5d6576; --line:#d9dde5;
          --accent:#2457c5; --ok:#1e7a46; --ok-bg:#e3f4ea; --bad:#b3261e; --bad-bg:#fde7e5; --warn:#8a5a00; --warn-bg:#fff2d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --panel:#1c2028; --text:#e6e9ef; --muted:#a0a8b8; --line:#343a46;
            --accent:#7aa2ff; --ok:#6fd39a; --ok-bg:#17321f; --bad:#ff8a80; --bad-bg:#3d1a18; --warn:#f3c25b; --warn-bg:#3a2f12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; flex: 1; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, button { font: inherit; color: var(--text); background: var(--panel);
                  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  input[type=text] { min-width: 0; width: 180px; }
  input.wide { flex: 1; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  .out { margin-top: 10px; overflow-x: auto; }
  .out:empty, [data-cerr]:empty, [data-stale]:empty { display: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
         background: var(--warn-bg); color: var(--warn); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .err { color: var(--bad); }
  .muted { color: var(--muted); }
  /* 진행 막대: 새 값까지 조회 간격(5초) 동안 일정한 속도로 늘어난다 (POLL_MS 와 같게) */
  .stage { display: grid; grid-template-columns: 6.5em minmax(80px, 260px) auto; gap: 4px 10px; align-items: center; margin: 4px 0; }
  .stage .info { display: flex; flex-wrap: wrap; gap: 0 8px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); transition: width 5s linear; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  button.link { border: none; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; }
  tr[data-diff] { cursor: pointer; }
  tr[data-diff]:hover td { background: rgba(36, 87, 197, 0.06); }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text);
           max-width: 780px; width: 94vw; max-height: 88vh; padding: 16px 18px; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dlg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; flex: 1; font-size: 16px; }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 600px) { .diff-grid { grid-template-columns: 1fr; } }
  .diff-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .diff-card h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  /* 잠금 풀기 줄: 평소엔 흐리게, 쓸 수 있을 때(.on)만 경고색 */
  .recover { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
  .recover.on { border-color: var(--warn); background: var(--warn-bg); color: var(--text); }
  .note { margin: 6px 0 0; padding-left: 1.3em; }
  .banner { margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .banner.bad { border-color: var(--bad); background: var(--bad-bg); }
  .banner.ok { border-color: var(--ok); background: var(--ok-bg); }
  .banner p { margin: 4px 0 0; }
  details { margin-top: 8px; }
  /* 탭: 반입·검증·승인 / 배포. 운영 번들은 두 탭 위에 늘 보인다 */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs [role=tab] { border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; padding: 7px 14px;
                     background: none; color: var(--muted); margin-bottom: -1px; }
  .tabs [role=tab][aria-selected=true] { background: var(--panel); border-color: var(--line); color: var(--text); font-weight: 600; }
  .tab-badge { margin-left: 4px; }
  .panel { display: grid; gap: 16px; min-width: 0; }
  .panel[hidden] { display: none; }
  summary { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>TradeProof 운영 화면</h1>
  <label class="row muted">담당자 <input type="text" id="actor" placeholder="이름" value="K"></label>
</header>
<main>
  <section>
    <div class="row"><h2 style="margin:0;flex:1">현재 운영 번들</h2><button id="btnActive">새로고침</button></div>
    <div class="out" id="activeOut" aria-live="polite"></div>
  </section>

  <div class="tabs" role="tablist" aria-label="작업">
    <button type="button" role="tab" id="tabReview" aria-controls="panelReview" aria-selected="true">반입·검증·승인</button>
    <button type="button" role="tab" id="tabDeploy" aria-controls="panelDeploy" aria-selected="false" tabindex="-1">배포<span class="tab-badge" id="deployBadge"></span></button>
  </div>

  <div class="panel" role="tabpanel" id="panelReview" aria-labelledby="tabReview">
  <section>
    <h2>1. 반입</h2>
    <div class="row">
      <input type="file" id="importFile" accept=".zip" aria-label="반입 ZIP 파일">
      <button class="primary" id="btnUpload">업로드</button>
      <input type="text" id="importId" list="importList" placeholder="반입 ID (고르거나 입력)" aria-label="반입 ID" autocomplete="off">
      <datalist id="importList"></datalist>
      <button id="btnImport">조회</button>
    </div>
    <div class="out" id="importOut" aria-live="polite"></div>
  </section>

  <section>
    <h2>2. 검증·승인</h2>
    <div class="row">
      <input type="text" id="bundleId" list="bundleList" placeholder="번들 ID (고르거나 입력)" aria-label="번들 ID" autocomplete="off">
      <datalist id="bundleList"></datalist>
      <button id="btnBundle">조회</button>
    </div>
    <div class="out" id="bundleOut" aria-live="polite"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" class="wide" id="reason" placeholder="사유 (승인·반려·다시 검증·잠금 풀기)" aria-label="사유">
      <button class="primary" id="btnApprove">승인</button>
      <button class="danger" id="btnReject">반려</button>
      <button id="btnRetry" disabled data-locked="1" title="검증이 실행 오류로 끝난 후보(candidate) 번들일 때 켜짐">다시 검증</button>
    </div>
    <!-- 항상 보인다. 배포 요청이 pending(D 접수 여부 모름)일 때만 확인 칸이 켜지고, 체크해야 버튼이 켜진다 -->
    <div class="row recover" id="recoverRow" title="배포 요청이 D 접수 여부 모름(pending)일 때 켜짐">
      <label style="flex:1"><input type="checkbox" id="recoverOk" disabled> D 에 이 번들의 배포 요청이 없음(미접수)을 확인했습니다</label>
      <button class="danger" id="btnRecover" disabled data-locked="1">배포 잠금 풀기</button>
    </div>
    <div class="out" id="approvalOut" aria-live="polite"></div>
  </section>
  </div>

  <div class="panel" role="tabpanel" id="panelDeploy" aria-labelledby="tabDeploy" hidden>
  <section>
    <h2>배포</h2>
    <div class="row">
      <input type="text" id="deployId" list="deployList" placeholder="배포 ID (고르거나 입력)" aria-label="배포 ID" autocomplete="off">
      <datalist id="deployList"></datalist>
      <button id="btnDeploy">조회</button>
      <input type="text" id="rollbackReason" placeholder="롤백 사유 (선택)" aria-label="롤백 사유">
      <button class="danger" id="btnRollback" disabled data-locked="1" title="배포를 조회한 뒤, 진행 중이거나 전체 반영된 배포일 때 켜짐">롤백</button>
    </div>
    <div class="out" id="deployOut" aria-live="polite"></div>
  </section>
  </div>
</main>

<dialog id="diffDlg" aria-labelledby="diffTitle">
  <div id="diffBody"></div>
</dialog>

<script>
/* 화면은 C 서버 한 곳만 부른다. B·D 는 C 의 중계(/api/b/…, /api/d/…)를 거친다 (브라우저의 다른 출처 호출·CORS 가 필요 없다).
   검증은 B 가 만든 검증 ID 하나로 따라간다: 번들(B) → 검증·게이트(B) → 달라진 거래(C, 같은 검증 ID) → 배포(D).
   기준: B = b_registry/docs/openapi/b_registry.json, C = docs/openapi/c_replay.json, D = docs/openapi/d_platform.json
   B  POST /imports (multipart: package)   -> 201 {import_id, bundle_id}
      GET  /imports/{id}                   -> {status:"APPROVED"|"REJECTED", reason, bundle_id, filename}
      GET  /bundles/active                 -> {active: 번들 | null, canary: 번들 | null} (둘이 함께 있을 수 있다: 카나리 배포 중)
      GET  /bundles/{id}                   -> {bundle_id, status, model_id, list_id, created_at, base_bundle_id, history:[…], model:{model_id, uri}, list:{list_id, uri}}
                                              history 의 deployment_request:{state:"accepted", deployment_id} 로 배포 ID 를 찾는다
      GET  /bundles/{id}/validation        -> {validation_id, status, baseline_bundle_id, gate:{decision:"passed"|"blocked", reasons, policy}, result:{golden, replay}, error}
                                              (검증을 아직 안 했으면 404)
      POST /approvals                      <- {bundle_id, decision:"approve"|"reject", actor, reason}
                                           -> 승인 202 {bundle_id, status, deployment_id} (D 에 배포까지 요청함)
                                              승인 200 {bundle_id, status, replacement_bundle_id} (대체 번들이 만들어짐)
                                              반려 200 {from, to, changed_at}
      POST /bundles/{id}/validations       <- {actor, reason}  실행 오류로 failed 인 candidate 만 다시 검증
                                           -> 202 새 검증 {validation_id, status:"queued", …} / 진행 중·게이트 불합격 409 / Job 상태 확인 불가 503
      POST /bundles/{id}/deployment-recovery <- {actor, reason, expected_changed_at, confirmed_not_received:true}
                                              expected_changed_at = history 의 마지막 deployment_request 항목의 changed_at
                                           -> 200 {bundle_id, status:"approved", request_state:"failed"} (잠금만 풂. 배포는 다시 승인)
                                              기록이 바뀜·D 에 배포가 있음 409 / D 조회 불가 503
      history 의 deployment_request.state: pending(D 접수 여부 모름, 잠김) | accepted(접수됨) | failed(보내지 못함) | rejected(D 가 거절)
   C  GET  /validations/{id}               -> {status, created_at, started_at, progress:{stage:"golden"|"replay", done, total, updated_at} | null}
                                              검증이 queued·running 일 때만 부른다 (진행 막대·경과 시간용)
      GET  /validations/{id}/diffs         -> {items:[{tx_id, direction, before:{bundle_id, classification, reasons}, after:{bundle_id, classification, reasons}, fields_changed:[{field, before, after}]}], total}
   D  GET  /deployments/{id}               -> {deployment_id, bundle_id, previous_bundle_id, status, weight, step_index, steps,
                                               rollback_reason:"manual"|"analysis_failed"|null,
                                               analysis:{result, checks, message, registry_sync, registry_change, rollback, initial}}
                                              진행 중(pending·progressing)이면 5초마다 다시 조회. D 는 감시 기준을 넘으면 스스로 롤백한다 (D PR #30)
      POST /deployments/{id}/rollback      <- {actor, reason}
   파일로 열면(file://) C 주소는 ?c=… (기본 http://localhost:8200). ?mock=1 이면 서버 없이 예시 데이터로 화면만 본다.
   ?mock=running 이면 검증이 진행 중인 화면을 본다 (조회할 때마다 처리 건수가 늘어난다).
   ?mock=failed 이면 검증이 실행 오류로 끝난 화면(다시 검증), ?mock=pending 이면 배포 요청이 잠긴 화면(배포 잠금 풀기)을 본다.
   ?mock=canary 이면 배포가 단계별로 올라가 전체 반영되는 화면, ?mock=rollback 이면 50% 단계에서 자동 롤백되는 화면을 본다. */
const q = new URLSearchParams(location.search);
const C_URL = q.get('c') || (location.protocol === 'file:' ? 'http://localhost:8200' : '');
const BASE = { b: C_URL + '/api/b', c: C_URL, d: C_URL + '/api/d' };
const MOCK = !q.has('mock') ? null : {
  'POST b/imports': { import_id: 'IMP-1' },
  'GET b/imports': { status: 'APPROVED', reason: null, bundle_id: 'B-9' },
  'GET b/bundles/active': { canary: null, active: { bundle_id: 'B-7', status: 'active', model_id: 'model-v3', list_id: 'list-v14',
    created_at: '2026-11-10T09:00:00Z', base_bundle_id: null } },
  'GET b/bundles': { bundle_id: 'B-9', status: 'validated', model_id: 'model-v4', list_id: 'list-v14',
    created_at: '2026-11-16T09:00:00Z', base_bundle_id: 'B-7',
    history: [{ from: 'candidate', to: 'validated', actor: 'b-registry', reason: 'Validation gate passed', changed_at: '2026-11-16T09:30:00Z', validation_id: 'RP-3f9a1c0b7d2e4a5b8c9d0e1f2a3b4c5d' }],
    model: { model_id: 'model-v4', uri: 's3://registry/models/model-v4.zip' },
    list: { list_id: 'list-v14', uri: 's3://registry/lists/list-v14.zip' } },
  'GET b/bundles/validation': { validation_id: 'RP-3f9a1c0b7d2e4a5b8c9d0e1f2a3b4c5d', bundle_id: 'B-9', baseline_bundle_id: 'B-7',
    model_id: 'model-v4', list_id: 'list-v14', actor: 'b-registry', reason: 'Automatic validation after bundle registration',
    status: 'completed', created_at: '2026-11-16T09:10:00Z', finished_at: '2026-11-16T09:30:00Z',
    policy: { min_accuracy: 0.9, require_complete_replay: true },
    gate: { decision: 'passed', reasons: [], policy: { min_accuracy: 0.9, require_complete_replay: true } },
    result: { status: 'completed', error: null,
      golden: { golden_version: 'golden-list-v14', total: 100,
        accuracy: { baseline: 1.0, candidate: 0.95, diff: -0.05 },
        false_negative: { baseline: 0, candidate: 1, diff: 1 }, false_positive: { baseline: 0, candidate: 0, diff: 0 } },
      replay: { total: 100, processed: 100, count_match: true, changed: 2, changed_down: 1 } },
    error: null },
  'POST b/approvals:approve': { bundle_id: 'B-9', status: 'canary', deployment_id: 'DP-1' },
  'POST b/approvals:reject': { from: 'validated', to: 'rejected', changed_at: '2026-11-16T10:00:00Z' },
  'GET c/validations/diffs': { total: 2, items: [
    { tx_id: 'TX-0012', direction: 'down',
      before: { bundle_id: 'B-7', classification: 'HIGH_RISK_HOLD',
        reasons: [{ rule: 'party_exact', field: 'buyer_name', value: 'ASTERIA HARBOR TRADING LLC', entry_id: 'DEMO-A001', matched_name: 'ASTERIA HARBOR TRADING LLC', score: 1.0, classification: 'HIGH_RISK_HOLD' }] },
      after: { bundle_id: 'B-9', classification: 'MANUAL_REVIEW',
        reasons: [{ rule: 'low_confidence', field: 'buyer_name', value: 'ASTERlA HARB0R TRADlNG LLC', entry_id: null, matched_name: null, score: 0.78, classification: 'MANUAL_REVIEW' }] },
      fields_changed: [{ field: 'buyer_name', before: 'ASTERIA HARBOR TRADING LLC', after: 'ASTERlA HARB0R TRADlNG LLC' }] },
    { tx_id: 'TX-0047', direction: 'up',
      before: { bundle_id: 'B-7', classification: 'PASS_CANDIDATE', reasons: [] },
      after: { bundle_id: 'B-9', classification: 'HIGH_RISK_HOLD',
        reasons: [{ rule: 'vessel_exact_ocr', field: 'vessel_name', value: 'MV N0RTHERN STAR', entry_id: 'OFAC-1042', matched_name: 'MV NORTHERN STAR', score: 0.94, classification: 'HIGH_RISK_HOLD' }] },
      fields_changed: [{ field: 'vessel_name', before: 'MV PACIFIC DAWN', after: 'MV N0RTHERN STAR' }] }] },
  'GET c/validations': mockRunning(),
  'GET d/deployments': { deployment_id: 'DP-1', bundle_id: 'B-9', previous_bundle_id: 'B-7', status: 'progressing',
    weight: 50, step_index: 1, steps: [10, 50, 100], requested_by: 'ops', created_at: '2026-11-16T10:05:00Z',
    analysis: { result: 'running', checks: [{ step_index: 0, weight: 10, result: 'passed', source: 'argo' }] } },
  // 수동 롤백: 다음 조회부터 rolled_back(manual) 으로 보인다
  'POST d/deployments': (body) => Object.assign(MOCK['GET d/deployments'], { status: 'rolled_back', weight: 0,
    rollback_reason: 'manual', finished_at: new Date().toISOString(),
    analysis: { ...MOCK['GET d/deployments'].analysis, result: 'failed', registry_sync: 'ok',
      registry_change: { bundle_id: 'B-9', to: 'cancelled', reason: 'manual rollback' },
      rollback: { actor: body && body.actor, reason: body && body.reason } } }),
};
// ?mock=canary: 조회할 때마다 10 → 50 → 100% 로 올라가 succeeded
// ?mock=rollback: 50% 단계에서 감시 실패 → D 가 자동 롤백 (PR #30 의 느린 모델 시연과 같은 모양)
function mockDeploy(fail) {
  let calls = 0;
  const base = { deployment_id: 'DP-1', bundle_id: 'B-9', previous_bundle_id: 'B-7', steps: [10, 50, 100],
    requested_by: 'kim', created_at: new Date().toISOString(), rollback_reason: null };
  const passed = n => [0, 1, 2].slice(0, n).map(i => ({ step_index: i, weight: base.steps[i], result: 'passed', source: 'argo' }));
  return () => {
    const n = calls++, now = new Date().toISOString();
    if (fail && n >= 3) return { ...base, status: 'rolled_back', weight: 0, step_index: 1, rollback_reason: 'analysis_failed',
      updated_at: now, finished_at: now, analysis: { result: 'failed', checks: passed(1), registry_sync: 'ok',
        registry_change: { bundle_id: 'B-9', to: 'cancelled', reason: 'analysis_failed' },
        message: 'RolloutAborted: Rollout aborted update to revision 3: Metric "latency-ratio" assessed Failed due to failed (2) > failureLimit (1)' } };
    if (!fail && n >= 4) return { ...base, status: 'succeeded', weight: 100, step_index: 2, updated_at: now, finished_at: now,
      analysis: { result: 'passed', checks: passed(3), registry_sync: 'ok', registry_change: { bundle_id: 'B-9', to: 'active', reason: 'succeeded' } } };
    const step = n < 2 ? 0 : 1;

    const m = MOCK[`${key}:${body && body.decision}`] || MOCK[key];

// 버튼 동작 공통: 실행 중 표시, 실패하면 사유 표시. 실행 중에는 같은 구역의 버튼을 잠가서 두 번 눌리지 않게 한다
// again 이 있고 결과에 진행 중 표시(PENDING)가 있으면 5초마다 같은 조회를 다시 한다.
// 같은 칸에서 새로 run 을 하면(_gen 이 바뀌면) 이전 자동 조회는 멈춘다.
const POLL_MS = 5000;
const PENDING = '<i data-pending></i>';
function poll(out, again, gen, fails = 0) {
  setTimeout(async () => {
    if (out._gen !== gen) return;
    try {
      LIVE = null;
      const html = await again();
      if (out._gen !== gen) return;
      if (!patchLive(out)) out.innerHTML = html;   // 진행 중인 검증이면 바뀐 숫자·막대만 고친다 (깜빡임·화면 읽기 반복 방지)
      if (out.querySelector('[data-pending]')) poll(out, again, gen);
    } catch (e) {
      if (out._gen !== gen) return;
      if (fails + 1 >= 3) out.insertAdjacentHTML('beforeend', `<p class="err">자동 조회 중지 (3번 연속 실패): ${esc(e.message)}</p>`);
      else poll(out, again, gen, fails + 1);
    }
  }, POLL_MS);
}
async function run(out, fn, again) {
  const gen = out._gen = (out._gen || 0) + 1;
  const buttons = out.closest('section').querySelectorAll('button');
  buttons.forEach(b => { b.disabled = true; });
  out.innerHTML = '<span class="muted">불러오는 중…</span>';
  try { out.innerHTML = await fn(); }
  catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  finally { buttons.forEach(b => { b.disabled = b.dataset.locked === '1'; }); }
  if (again && out.querySelector('[data-pending]')) poll(out, again, gen);
}

}
// 진행 중인 검증: 상태·시각·처리 건수는 C 의 검증 행에서 읽는다 (B 는 끝난 결과만 받는다)
// - 경과 시간: 시작 시각(data-since)만 받아 두고 브라우저가 1초마다 센다 (서버를 부르지 않는다)
// - 막대: 받은 값까지 CSS transition 으로 5초 동안 늘어난다. 숫자는 실제로 받은 값만 보여 준다
// - 남은 시간: 최근 기록(updated_at, done) 몇 개로 처리 속도를 구해 이 단계의 남은 시간을 10초 단위로 보여 준다
// - 다시 조회해도 단계·상태가 같으면 숫자·막대만 고친다 (patchLive). 단계가 바뀔 때만 화면 읽기 프로그램에 알린다
const STAGES = [['golden', '① 골든셋'], ['replay', '② Replay']];
const STALE_SEC = 60;  // 검증 Job 은 2초마다 적는다. 이보다 오래 소식이 없으면 멈췄을 수 있다고 알려 준다
const secondsSince = t => Math.max(0, Math.round((Date.now() - Date.parse(t)) / 1000));
const duration = s => s < 60 ? `${s}초` : `${Math.floor(s / 60)}분 ${s % 60}초`;
const elapsed = t => t ? ` · 경과 <span data-since="${esc(t)}">${duration(secondsSince(t))}</span>` : '';
setInterval(() => document.querySelectorAll('[data-since]').forEach(el => {
  el.textContent = duration(secondsSince(el.dataset.since));
}), 1000);

let LIVE = null;            // 마지막으로 그린 진행 중 검증 {vid, v, c}. poll 이 patchLive 에 넘긴다
const SAMPLES = new Map();  // `${검증 ID}|${단계}` -> 최근 기록 [{t, done}] (남은 시간 계산용)
function remaining(vid, p) {
  const key = `${vid}|${p.stage}`, list = SAMPLES.get(key) || [], t = Date.parse(p.updated_at);
  if (!list.length || list.at(-1).t !== t) list.push({ t, done: p.done });
  SAMPLES.set(key, list.slice(-4));
  const a = list.at(-4) || list[0], b = list.at(-1), rate = (b.done - a.done) / ((b.t - a.t) / 1000);
  if (list.length < 2 || !(rate > 0) || p.done >= p.total) return '';
  return `이 단계 약 ${duration(Math.ceil((p.total - p.done) / rate / 10) * 10)} 남음`;
}
const pctOf = p => p.total ? Math.floor(p.done * 100 / p.total) : 0;
function stageRow(stage, name, p, vid) {
  const idx = STAGES.findIndex(([k]) => k === stage), cur = p ? STAGES.findIndex(([k]) => k === p.stage) : -1;
  let body;
  if (idx < cur) body = `<span>${tag('완료', 'ok')}</span>`;
  else if (idx > cur) body = '<span class="muted">대기</span>';
  else body = `<div class="bar" role="progressbar" aria-label="${name} 진행" aria-valuemin="0" aria-valuemax="${esc(p.total)}" aria-valuenow="${esc(p.done)}">
      <div class="fill" style="width:${pctOf(p)}%"></div></div>
    <span class="info"><span data-count>${esc(p.done)}/${esc(p.total)} (${pctOf(p)}%)</span><span class="muted" data-eta>${remaining(vid, p)}</span></span>`;
  return `<div class="stage" data-stage="${stage}"><span>${name}</span>${body.startsWith('<div') ? body : `${body}<span></span>`}</div>`;
}
const staleText = p => p && secondsSince(p.updated_at) > STALE_SEC
  ? `${duration(secondsSince(p.updated_at))} 동안 진행 기록이 없음. 검증 Job 이 멈췄을 수 있습니다` : '';
const liveKey = (v, c) => `${v.status}|${c && c.progress ? c.progress.stage : '-'}`;
function liveInner(v, c) {
  if (v.status === 'queued') return `<p>${statusTag('queued')} 검증 Job 이 시작되기를 기다림${elapsed(v.created_at)}</p>`;
  const p = c && c.progress;
  return `<p>${statusTag('running')} ${p ? `${STAGES.find(([k]) => k === p.stage)[1].slice(2)} 처리 중` : '골든셋과 Replay 처리 중'}${elapsed(c && (c.started_at || c.created_at))}</p>
    ${STAGES.map(([k, name]) => stageRow(k, name, p, v.validation_id)).join('')}
    ${p && p.stage === 'golden' ? '<p class="muted">골든셋은 운영·후보 번들로 한 번씩 처리하므로 전체 건수가 골든셋의 2배입니다</p>' : ''}
    <p class="err" data-stale>${staleText(p)}</p>`;
}
const announceText = (v, c) => v.status === 'queued' ? '검증 대기 중'
  : c && c.progress ? `${STAGES.find(([k]) => k === c.progress.stage)[1].slice(2)} 단계 처리 중` : '검증 중';
// 같은 검증이 같은 단계로 계속 진행 중이면 숫자·막대·남은 시간만 고치고 true. 아니면 false (호출한 쪽이 전체를 다시 그린다)
function patchLive(out) {
  const box = out.querySelector('[data-live]');
  if (!LIVE || !box || box.dataset.live !== LIVE.vid) return false;
  const { v, c, cErr } = LIVE, p = c && c.progress;
  const errEl = out.querySelector('[data-cerr]');
  if (errEl) errEl.textContent = cErr;
  if (box.dataset.key !== liveKey(v, c)) {   // 상태·단계가 바뀜: 이 칸만 다시 그리고 알린다
    box.innerHTML = liveInner(v, c);
    box.dataset.key = liveKey(v, c);
    out.querySelector('[data-announce]').textContent = announceText(v, c);
    return true;
  }
  if (p) {
    const row = box.querySelector(`[data-stage="${p.stage}"]`);
    row.querySelector('.fill').style.width = `${pctOf(p)}%`;
    row.querySelector('[role=progressbar]').setAttribute('aria-valuenow', p.done);
    row.querySelector('[data-count]').textContent = `${p.done}/${p.total} (${pctOf(p)}%)`;
    row.querySelector('[data-eta]').textContent = remaining(v.validation_id, p);
  }
  const staleEl = box.querySelector('[data-stale]');
  if (staleEl) staleEl.textContent = staleText(p);
  return true;
}
// 검증 한 건: 상태·게이트·지표는 B 가 받은 결과, 달라진 거래는 같은 검증 ID 로 C 에서
const METRICS = [['accuracy', '정확도'], ['false_negative', '미탐'], ['false_positive', '오탐']];
const CLASS_LABELS = { PASS_CANDIDATE: '통과 후보', MANUAL_REVIEW: '담당자 검토', HIGH_RISK_HOLD: '고위험 보류' };
const FIELD_LABELS = {
  invoice_no: '송장 번호', invoice_date: '송장 일자', bl_no: 'B/L 번호', seller_name: '판매자(Shipper)',
  seller_country: '판매자 국가', buyer_name: '구매자(Consignee)', buyer_country: '구매자 국가', vessel_name: '선박',
  port_of_loading: '선적항', port_of_discharge: '양하항', goods_description: '품명', currency: '통화', amount: '금액',
};
const RULE_LABELS = {
  party_exact: '당사자 정확 일치', vessel_exact: '선박 정확 일치',
  party_fuzzy: '당사자 유사', vessel_fuzzy: '선박 유사',
  party_exact_ocr: '당사자 OCR 혼동 감안 일치', vessel_exact_ocr: '선박 OCR 혼동 감안 일치',
  party_match_other_doc: '당사자: 다른 서류 값으로 일치', vessel_match_other_doc: '선박: 다른 서류 값으로 일치',
  low_confidence: 'OCR 신뢰도 낮음', doc_conflict: 'Invoice·B/L 불일치',
  missing_field: '필드 못 읽음', processing_failed: '처리 실패',
};
const clsTag = c => !c ? '-' : tag(CLASS_LABELS[c] ? `${c} · ${CLASS_LABELS[c]}` : c,
  c === 'PASS_CANDIDATE' ? 'ok' : c === 'HIGH_RISK_HOLD' ? 'bad' : '');
const fieldName = f => !f ? '-' : (FIELD_LABELS[f] ? `${FIELD_LABELS[f]} (${f})` : f);
const ruleName = r => !r ? '-' : (RULE_LABELS[r] ? `${RULE_LABELS[r]} (${r})` : r);
const valCell = v => v === null || v === undefined || v === '' ? '<span class="muted">(없음)</span>' : `<span class="mono">${esc(v)}</span>`;

let DIFFS = [];      // 현재 화면에 그린 달라진 거래 목록 (상세 모달에서 인덱스로 참조)
let DIFF_META = {};  // { validation_id, baseline_bundle_id, bundle_id }

function reasonKey(r) {
  return [r.rule, r.field, r.value, r.entry_id, r.matched_name, r.classification].map(v => v ?? '').join('|');
}

function reasonsHtml(reasons, otherReasons, mode) {
  const rs = reasons || [];
  if (!rs.length) return '<p class="muted" style="margin:6px 0">판정 근거 없음 (일치·경고 규칙에 걸리지 않음)</p>';
  const otherKeys = new Set((otherReasons || []).map(reasonKey));
  return `<table><tr><th>변화</th><th>규칙</th><th>분류</th><th>필드</th><th>추출 값</th><th>매칭 대상</th><th>점수</th></tr>${rs.map(r => {
    const same = otherKeys.has(reasonKey(r));
    const badge = same ? tag('유지') : mode === 'before' ? tag('해제됨', 'bad') : tag('신규', 'ok');
    const match = [r.matched_name, r.entry_id ? `(${r.entry_id})` : ''].filter(Boolean).join(' ');
    const score = typeof r.score === 'number' ? r.score.toFixed(2) : (r.score ?? '-');
    return `<tr><td>${badge}</td><td>${esc(ruleName(r.rule))}</td><td>${r.classification ? clsTag(r.classification) : '-'}</td>
      <td>${esc(fieldName(r.field))}</td><td>${valCell(r.value)}</td><td>${match ? esc(match) : '<span class="muted">-</span>'}</td>
      <td class="num">${esc(score)}</td></tr>`;
  }).join('')}</table>`;
}

function openDiffDetail(idx) {
  const d = DIFFS[idx];
  if (!d) return;
  const dlg = $('diffDlg'), body = $('diffBody');
  const bSide = d.before || {}, aSide = d.after || {};
  const bBundle = bSide.bundle_id || DIFF_META.baseline_bundle_id || '이전';
  const aBundle = aSide.bundle_id || DIFF_META.bundle_id || '후보';
  const fc = d.fields_changed || [];
  const dirTag = tag(d.direction === 'down' ? '위험도 낮아짐' : '위험도 높아짐', d.direction === 'down' ? 'bad' : '');
  body.innerHTML = `
    <div class="dlg-head">
      <h2 id="diffTitle"><span class="mono">${esc(d.tx_id)}</span> Replay 상세 비교 ${dirTag}</h2>
      <span class="muted">${idx + 1} / ${DIFFS.length}</span>
      <button type="button" data-nav="${idx - 1}" ${idx <= 0 ? 'disabled' : ''}>◀ 이전 거래</button>
      <button type="button" data-nav="${idx + 1}" ${idx >= DIFFS.length - 1 ? 'disabled' : ''}>다음 거래 ▶</button>
      <button type="button" data-close="1">닫기</button>
    </div>
    <div class="diff-grid">
      <div class="diff-card">
        <h4>이전 판정 (운영 · <span class="mono">${esc(bBundle)}</span>)</h4>
        <div>${clsTag(bSide.classification)}</div>
      </div>
      <div class="diff-card">
        <h4>후보 판정 (후보 · <span class="mono">${esc(aBundle)}</span>)</h4>
        <div>${clsTag(aSide.classification)}</div>
      </div>
    </div>
    <h3>바뀐 추출 필드 (${fc.length}건)</h3>
    ${fc.length ? `<table><tr><th>필드</th><th>이전 값 (${esc(bBundle)})</th><th>후보 값 (${esc(aBundle)})</th></tr>${fc.map(f =>
      `<tr><td>${esc(fieldName(f.field))}</td><td>${valCell(f.before)}</td><td>${valCell(f.after)}</td></tr>`).join('')}</table>`
      : '<p class="muted">바뀐 추출 필드 없음 (추출 텍스트는 같고 제재 리스트 또는 판정 근거만 달라짐)</p>'}
    <h3>이전 판정 근거 (${esc(bBundle)} · ${((bSide.reasons) || []).length}건)</h3>
    ${reasonsHtml(bSide.reasons, aSide.reasons, 'before')}
    <h3>후보 판정 근거 (${esc(aBundle)} · ${((aSide.reasons) || []).length}건)</h3>
    ${reasonsHtml(aSide.reasons, bSide.reasons, 'after')}`;
  dlg.dataset.idx = String(idx);
  if (!dlg.open) dlg.showModal();
}

$('bundleOut').addEventListener('click', e => {
  const t = e.target.closest('[data-diff]');
  if (t) openDiffDetail(Number(t.dataset.diff));
});
$('diffDlg').addEventListener('click', e => {
  if (e.target === $('diffDlg') || e.target.closest('[data-close]')) { $('diffDlg').close(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav && !nav.disabled) openDiffDetail(Number(nav.dataset.nav));
});
$('diffDlg').addEventListener('keydown', e => {
  const idx = Number($('diffDlg').dataset.idx);
  if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); openDiffDetail(idx - 1); }
  else if (e.key === 'ArrowRight' && idx < DIFFS.length - 1) { e.preventDefault(); openDiffDetail(idx + 1); }
});

async function showValidation(v) {
  if (v.status === 'queued' || v.status === 'running') {  // 끝날 때까지 자동으로 다시 조회
    let c = null, cErr = '';
    try { c = await api('c', 'GET', `/validations/${seg(v.validation_id)}`); }
    catch (e) {
      // 검증 Job 이 C 에 행을 만들기 전(404)이면 정상 대기 상태로 본다
      if (!/^(NOT_FOUND|404)\b/.test(e.message)) cErr = `진행 상황 조회 실패 (C): ${e.message}`;
    }
    if (c && c.status !== 'queued' && c.status !== 'running') c = null;  // C 에서는 이미 끝남: B 가 결과를 받으면 다음 조회에 반영된다
    const now = c ? { ...v, status: c.status, created_at: c.created_at } : v;
    LIVE = { vid: v.validation_id, v: now, c, cErr };
    // data-live 칸 안의 잦은 변화(경과 시간 등)는 읽지 않는다(aria-live=off). 단계가 바뀔 때만 data-announce 로 알린다
    return `<h3>검증 ${esc(v.validation_id)}</h3><p class="muted">기준 ${esc(v.baseline_bundle_id)} → 후보 ${esc(v.bundle_id)}</p>
      <div data-live="${esc(v.validation_id)}" data-key="${esc(liveKey(now, c))}" aria-live="off">${liveInner(now, c)}</div>
      <p class="sr-only" data-announce aria-live="polite"></p><p class="muted" data-cerr>${esc(cErr)}</p>${PENDING}`;
  }
  const head = `<h3>검증 ${esc(v.validation_id)}</h3><p>${statusTag(v.status)} 기준 ${esc(v.baseline_bundle_id)} → 후보 ${esc(v.bundle_id)}</p>`;
  if (v.status === 'failed') {   // 실행 오류 (게이트 불합격과 다르다: 그건 completed + 번들 validation_failed)
    return `${head}<p class="err">실행 오류: ${esc(v.error)}</p>
      <p class="muted">검증 Job 이 끝까지 돌지 못했습니다. 원인을 고친 뒤 아래 <b>다시 검증</b>을 누르면 새 검증을 시작합니다 (후보(candidate) 번들만).</p>
      ${gateHtml(v.gate)}`;
  }
  const g = v.result && v.result.golden, rp = v.result && v.result.replay;
  if (!g || !rp) return head + gateHtml(v.gate);
  let diffs, diffErr = '';
  try { diffs = (await api('c', 'GET', `/validations/${seg(v.validation_id)}/diffs?limit=200`)).items || []; }
  catch (e) { diffs = []; diffErr = `<p class="err">달라진 거래 조회 실패 (C): ${esc(e.message)}</p>`; }
  DIFFS = diffs;
  DIFF_META = { validation_id: v.validation_id, baseline_bundle_id: v.baseline_bundle_id, bundle_id: v.bundle_id };
  return `${head}${gateHtml(v.gate)}
    <h3>골든셋 검증 (${esc(g.total)}건)</h3>
    <table><tr><th>지표</th><th>운영</th><th>후보</th><th>차이</th></tr>${METRICS.map(([k, name]) =>
      `<tr><td>${name}</td><td class="num">${esc(num(g[k].baseline))}</td><td class="num">${esc(num(g[k].candidate))}</td><td class="num">${esc(num(g[k].diff))}</td></tr>`).join('')}</table>
    <h3>Replay</h3>
    <p>처리 ${esc(rp.processed)} / 전체 ${esc(rp.total)} ${tag(rp.count_match ? '건수 일치' : '건수 불일치', rp.count_match ? 'ok' : 'bad')} · 달라진 거래 ${esc(rp.changed)}건 (위험도 낮아짐 ${esc(rp.changed_down)}건)</p>
    ${diffs.length ? `<table><tr><th>거래</th><th>방향</th><th>이전</th><th>후보</th><th>상세</th></tr>${diffs.map((d, i) =>
      `<tr data-diff="${i}"><td><button type="button" class="link mono" data-diff="${i}">${esc(d.tx_id)}</button></td><td>${tag(d.direction === 'down' ? '낮아짐' : '높아짐', d.direction === 'down' ? 'bad' : '')}</td><td>${clsTag(d.before && d.before.classification)}</td><td>${clsTag(d.after && d.after.classification)}</td><td><button type="button" data-diff="${i}">상세 보기</button></td></tr>`).join('')}</table>` : ''}${diffErr}`;
}
const decide = async decision => {
  let sent = false, started = false;
  await run($('approvalOut'), async () => {
    const body = { bundle_id: need($('bundleId')), decision, actor: need($('actor')), reason: need($('reason')) };
    const ask = decision === 'approve' ? `번들 ${body.bundle_id}을(를) 승인할까요?\n승인하면 D 에 배포가 바로 요청됩니다` : `번들 ${body.bundle_id}을(를) 반려할까요?`;
    if (!confirm(ask)) return '';
    const r = await api('b', 'POST', '/approvals', body);
    sent = true;
    if (decision === 'reject') return `${tag('반려됨', 'bad')} <span class="muted">${esc(r.from)} → ${esc(r.to)}</span>`;
    if (r.replacement_bundle_id) {
      $('bundleId').value = r.replacement_bundle_id;
      return `${tag('배포 안 됨', 'bad')} <span class="muted">운영 번들이 바뀌어 이 번들은 ${esc(r.status)} 처리됨</span>
      <p>대체 번들 <b>${esc(r.replacement_bundle_id)}</b> 이(가) 만들어짐. 다시 검증하고 승인해야 함</p>`;
    }
    if (r.status !== 'canary' && r.status !== 'active') {
      return `${tag('배포 시작 안 됨', 'bad')} <span class="muted">번들 상태가 ${statusTag(r.status)} 이므로 새 배포가 시작되지 않았습니다${r.deployment_id ? ` (기존 배포 ID ${esc(r.deployment_id)})` : ''}</span>`;
    }
    $('deployId').value = r.deployment_id;
    started = true;
    return `${tag('승인됨', 'ok')} 배포 요청함 · 배포 ID <b>${esc(r.deployment_id)}</b> <span class="muted">번들 상태 ${esc(r.status)}</span> <button type="button" class="link" data-goto="deploy">배포 탭에서 진행 보기</button>`;
  });
  if (sent) { $('btnBundle').click(); refreshActive(); }  // 버튼 잠금이 풀린 뒤에 번들·운영 번들을 다시 조회
  if (started) followDeploy();   // canary 단계·감시 결과를 자동 조회로 따라간다
};
$('btnApprove').onclick = () => decide('approve');
$('btnReject').onclick = () => decide('reject');

// B 의 409·503 에 이 동작에서의 뜻을 붙인다. 원래 메시지도 괄호로 남긴다
function explain(e, notes) {
  const note = notes[e.message.split(':')[0]];
  return note ? new Error(`${note} (${e.message})`) : e;
}
// 버튼 동작 뒤에 번들(과 운영 번들)을 다시 조회한다. 버튼 잠금이 풀린 뒤에 부른다
async function act(fn, after) {
  let sent = false;
  await run($('approvalOut'), async () => { const html = await fn(); sent = html !== ''; return html; });
  if (sent) { $('btnBundle').click(); if (after) after(); }
}

// 다시 검증 (B-1): 실행 오류로 끝난 후보의 검증을 새로 시작. 시작되면 번들 조회가 진행 막대를 따라간다
$('btnRetry').onclick = () => act(async () => {
  const id = need($('bundleId')), actor = need($('actor')), reason = need($('reason'));
  if (!confirm(`번들 ${id}의 검증을 다시 실행할까요?\n골든셋과 Replay 를 처음부터 다시 돌립니다`)) return '';
  const r = await api('b', 'POST', `/bundles/${seg(id)}/validations`, { actor, reason }).catch(e => { throw explain(e, {
    CONFLICT: '다시 검증할 수 없음: 진행 중인 검증이 있거나, 실행 오류가 아닌 게이트 불합격입니다',
    SERVICE_UNAVAILABLE: '이전 검증 Job 상태를 확인하지 못해 시작하지 않았습니다. 잠시 뒤 다시 누르세요' }); });
  return `${tag('다시 검증 시작', 'ok')} 새 검증 <b>${esc(r.validation_id)}</b> ${statusTag(r.status)}`;
});

// 배포 잠금 풀기 (B-3): pending 요청을 운영자 확인으로 failed 로 닫는다. 배포는 하지 않는다
$('btnRecover').onclick = () => act(async () => {
  const id = need($('bundleId')), actor = need($('actor')), reason = need($('reason'));
  const a = CUR && CUR.bundle_id === id && CUR.attempt;
  if (!a || a.state !== 'pending') throw new Error('번들을 다시 조회하세요 (잠긴 배포 요청이 없음)');
  if (!$('recoverOk').checked) throw new Error('D 에 요청이 없음을 확인했다는 칸을 체크하세요');
  if (!confirm(`번들 ${id}의 배포 잠금을 풀까요?\n요청 시각 ${a.changed_at}\nD 에 이 번들의 배포가 없음을 확인한 경우에만 누르세요. 배포는 다시 승인해야 합니다`)) return '';
  const r = await api('b', 'POST', `/bundles/${seg(id)}/deployment-recovery`, {
    actor, reason, expected_changed_at: a.changed_at, confirmed_not_received: true,
  }).catch(e => { throw explain(e, {
    CONFLICT: '잠금을 풀지 않음: 그 사이 배포 요청 기록이 바뀌었거나 D 에 이 번들의 배포가 있습니다. 번들을 다시 조회하세요',
    SERVICE_UNAVAILABLE: '잠금을 풀지 않음: B 가 D 의 배포 목록을 확인하지 못했습니다' }); });
  return `${tag('잠금 풀림', 'ok')} 번들 ${esc(r.bundle_id)} ${statusTag(r.status)} <span class="muted">요청 기록 ${esc(r.request_state)}</span>
    <p>자동으로 배포하지 않습니다. 배포하려면 <b>승인</b>을 다시 누르세요</p>`;
}, refreshActive);

// 배포 탭: 배포 상태·롤백 (D PR #30: canary 동안 지표 감시, 기준을 넘으면 D 가 스스로 롤백)
// D 응답: {status, weight, step_index, steps, rollback_reason: manual | analysis_failed,
//          analysis: {result, checks:[{step_index, weight, result}], message, registry_sync, registry_change, rollback, initial}}
// Argo 가 감시 실패로 멈추면 실패한 단계는 checks 에 들어오지 않는다 → 단계 상태는 step_index·status 로 정한다
const DEP_RUNNING = ['pending', 'progressing'];
const DEP_NOTE = { pending: '시작 대기', progressing: 'canary 진행 중', succeeded: '전체 반영', rolled_back: '롤백됨', failed: '실패' };
const depTag = s => tag(DEP_NOTE[s] ? `${s} · ${DEP_NOTE[s]}` : s ?? '-', s === 'succeeded' ? 'ok' : ['rolled_back', 'failed'].includes(s) ? 'bad' : '');
const DEP_LAST = new Map();   // 배포 ID -> 마지막으로 본 status (진행 중 → 끝으로 바뀐 순간을 알려고)

// D-1·D-2: 단계마다 상태 하나 (통과·진행 중·중단·대기)
function stepState(d, i) {
  const check = (d.analysis && d.analysis.checks || []).find(c => c.step_index === i);
  if (check && check.result === 'failed') return ['감시 실패', 'bad'];
  if (d.status === 'succeeded' || (check && check.result === 'passed')) return ['통과', 'ok'];
  if (i < d.step_index) return ['통과', 'ok'];
  if (i > d.step_index) return [DEP_RUNNING.includes(d.status) ? '대기' : '진행 안 함', 'muted'];
  if (d.status === 'rolled_back') return [d.rollback_reason === 'analysis_failed' ? '감시 실패 · 중단' : '중단', 'bad'];
  if (d.status === 'failed') return ['실패', 'bad'];
  return ['진행 중 · 감시 중', ''];
}
function stepsHtml(d) {
  const steps = d.steps || [];
  if (!steps.length) return '';
  const rows = steps.map((w, i) => {
    const [text, cls] = stepState(d, i);
    const now = i === d.step_index && DEP_RUNNING.includes(d.status);
    return `<tr${now ? ' style="font-weight:600"' : ''}><td>${i + 1}단계</td><td class="num">${esc(w)}%</td>
      <td>${cls === 'muted' ? `<span class="muted">${esc(text)}</span>` : tag(text, cls)}</td></tr>`;
  }).join('');
  // 진행 막대 없이 지금 비율만 한 줄로 (단계별 비율은 아래 표)
  const w = Math.max(0, Math.min(100, Number(d.weight) || 0));
  return `<p>후보 트래픽 <b>${w}%</b> <span class="muted">→ ${esc(d.bundle_id)} · 나머지 → ${esc(d.previous_bundle_id)}</span></p>
    <table><tr><th>단계</th><th>후보 트래픽</th><th>감시 결과</th></tr>${rows}</table>
    <p class="muted">단계마다 후보 번들의 처리 시간·처리 실패율을 운영 번들과 비교합니다. 기준값은 A 차트의 <span class="mono">analysis</span> 값에서 정합니다.</p>`;
}
// D-3: 끝난 배포가 왜 그렇게 끝났는지
function outcomeHtml(d) {
  const a = d.analysis || {}, msg = a.message ? `<p class="muted">D 가 본 사유: <span class="mono">${esc(a.message)}</span></p>` : '';
  if (a.initial) return `<div class="banner">${tag('최초 번들', 'ok')} canary 없이 운영 번들로 기록했습니다 (롤백 대상 아님)</div>`;
  if (d.status === 'rolled_back' && d.rollback_reason === 'analysis_failed') {
    return `<div class="banner bad">${tag('자동 롤백', 'bad')} <b>지표 감시 기준을 넘어 D 가 스스로 되돌렸습니다</b>
      <p>${esc(d.step_index + 1)}단계(${esc((d.steps || [])[d.step_index])}%)에서 후보 ${esc(d.bundle_id)} 의 처리 시간 또는 처리 실패율이 기준을 넘었습니다.
      트래픽은 모두 ${esc(d.previous_bundle_id)} 로 돌아갔고, B 에서 후보는 cancelled 입니다.</p>${msg}</div>`;
  }
  if (d.status === 'rolled_back') {
    const r = a.rollback || {};
    return `<div class="banner bad">${tag('수동 롤백', 'bad')} ${esc(r.actor || d.requested_by)} 이(가) 롤백했습니다${r.reason ? ` · 사유: ${esc(r.reason)}` : ''}
      <p class="muted">트래픽은 모두 ${esc(d.previous_bundle_id)} 로 돌아갔습니다.</p></div>`;
  }
  if (d.status === 'failed') return `<div class="banner bad">${tag('배포 실패', 'bad')} 배포를 시작하지 못했거나 배포 밖에서 바뀌었습니다${msg}</div>`;
  if (d.status === 'succeeded') return `<div class="banner ok">${tag('전체 반영', 'ok')} 모든 단계 감시를 통과해 ${esc(d.bundle_id)} 가 운영 번들이 되었습니다</div>`;
  return '';
}
// D-4: D 가 배포 결과를 B 번들 상태에 반영했는지 (반영돼야 '현재 운영 번들'이 바뀐다)
function registryHtml(d) {
  const a = d.analysis || {}, c = a.registry_change, to = c ? ` (${esc(c.bundle_id)} → ${esc(c.to)})` : '';
  if (!a.registry_sync) return DEP_RUNNING.includes(d.status) ? '' : '<p class="muted">B 반영: 기록 없음</p>';
  const S = { ok: [tag('B 반영됨', 'ok'), ''], pending: [tag('B 반영 재시도 중'), 'D 가 B 에 다시 알릴 예정입니다. 그동안 B 번들 상태가 늦게 바뀝니다'],
    rejected: [tag('B 가 거부', 'bad'), 'B 번들 상태와 실제 배포가 다를 수 있습니다. B·D 담당자 확인이 필요합니다'] };
  const [t, note] = S[a.registry_sync] || [tag(a.registry_sync), ''];
  return `<p>${t}${to}${note ? ` <span class="muted">${note}</span>` : ''}</p>`;
}
function setRollbackButton(d) {
  // 진행 중·반영 완료만 롤백할 수 있다 (최초 번들·이미 끝난 롤백·실패는 D 가 409)
  lock($('btnRollback'), !!d && !(d.analysis && d.analysis.initial) && [...DEP_RUNNING, 'succeeded'].includes(d.status));
}
$('deployId').oninput = () => setRollbackButton(null);
async function showDeploy(id) {
  let d;
  try { d = await api('d', 'GET', `/deployments/${id}`); }
  catch (e) { setRollbackButton(null); throw e; }
  setRollbackButton(d);
  setDeployBadge(d);
  // 진행 중이던 배포가 끝났으면(자동 롤백 포함) 운영 번들과 같은 번들의 2구역을 다시 읽는다
  const before = DEP_LAST.get(d.deployment_id);
  DEP_LAST.set(d.deployment_id, d.status);
  if (DEP_RUNNING.includes(before) && !DEP_RUNNING.includes(d.status)) {
    refreshActive();
    if ($('bundleId').value.trim() === d.bundle_id) loadBundle(d.bundle_id);
  }
  const open = $('deployOut').querySelector('details[open]') ? ' open' : '';   // 자동 조회로 다시 그려도 펼친 상태 유지
  const a = d.analysis || {};
  return `<p><b>${esc(d.deployment_id)}</b> ${depTag(d.status)} <span class="muted">${esc(d.previous_bundle_id)} → ${esc(d.bundle_id)} · 요청 ${esc(d.requested_by)}</span></p>
    ${outcomeHtml(d)}
    ${a.initial ? '' : stepsHtml(d)}
    ${registryHtml(d)}
    <details${open}><summary class="muted">D 응답 전체</summary>${kv(d)}</details>
    ${DEP_RUNNING.includes(d.status) ? PENDING : ''}`;
}
function followDeploy() {
  let id;
  return run($('deployOut'), () => showDeploy(id = seg(need($('deployId')))), () => showDeploy(id));
}
$('btnDeploy').onclick = followDeploy;
$('btnRollback').onclick = () => run($('deployOut'), async () => {
  const id = need($('deployId')), actor = need($('actor')), reason = $('rollbackReason').value.trim();
  if (!confirm(`배포 ${id}을(를) 롤백할까요?\n사유: ${reason || '없음'}`)) return '';
  await api('d', 'POST', `/deployments/${seg(id)}/rollback`, { actor, reason });
  refreshActive();  // 롤백하면 운영·카나리 번들이 바뀐다
  return showDeploy(seg(id));
});

// 탭: 반입·검증·승인 / 배포. 주소 끝 #deploy 면 배포 탭으로 연다 (새로고침해도 유지)
// 다른 탭에 있어도 자동 조회는 계속 돈다 (승인 뒤 배포 진행·자동 롤백을 놓치지 않게) → 배포 탭 이름 옆에 상태를 띄운다
const TABS = { review: ['tabReview', 'panelReview'], deploy: ['tabDeploy', 'panelDeploy'] };
function showTab(name, focus = false) {
  for (const [key, [tab, panel]] of Object.entries(TABS)) {
    const on = key === name;
    $(tab).setAttribute('aria-selected', String(on));
    $(tab).tabIndex = on ? 0 : -1;
    $(panel).hidden = !on;
  }
  if (focus) $(TABS[name][0]).focus();
  try { history.replaceState(null, '', location.pathname + location.search + (name === 'deploy' ? '#deploy' : '')); } catch (e) { /* file:// 등 */ }
}
$('tabReview').onclick = () => showTab('review');
$('tabDeploy').onclick = () => showTab('deploy');
document.querySelector('[role=tablist]').addEventListener('keydown', e => {   // ← → Home End 로 탭 이동
  const keys = Object.keys(TABS), cur = keys.findIndex(k => $(TABS[k][0]).getAttribute('aria-selected') === 'true');
  const next = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: keys.length - 1 }[e.key];
  if (next === undefined) return;
  e.preventDefault();
  showTab(keys[(next + keys.length) % keys.length], true);
});
document.addEventListener('click', e => {   // 결과 문구 안의 "배포 탭에서 보기"
  const go = e.target.closest('[data-goto]');
  if (go) showTab(go.dataset.goto, true);
});
// 배포 탭 이름 옆 상태: 진행 중이면 파랑, 롤백·실패면 빨강, 반영이면 초록
function setDeployBadge(d) {
  const s = d && d.status;
  $('deployBadge').innerHTML = !s ? '' : tag(DEP_NOTE[s] || s, s === 'succeeded' ? 'ok' : ['rolled_back', 'failed'].includes(s) ? 'bad' : '');
}
showTab(location.hash === '#deploy' ? 'deploy' : 'review');

// ID 입력란의 고르기 목록 (datalist): 고르면 바로 조회, 목록에 없는 ID 는 직접 입력해도 된다
// - 번들: B GET /bundles (최신 먼저), 배포: D GET /deployments?limit=50 (최신 먼저)
// - 반입: B 에 목록 API 가 없어 이 브라우저에서 올리거나 조회한 반입만 기억한다 (localStorage, 최근 30건)
const IMPORTS_KEY = 'tradeproof.admin.imports';
function recentImports() {
  try { return JSON.parse(localStorage.getItem(IMPORTS_KEY) || '[]'); } catch (e) { return []; }
}
function rememberImport(r) {
  const old = recentImports().find(x => x.import_id === r.import_id) || {};
  const merged = { ...old, ...Object.fromEntries(Object.entries(r).filter(([, v]) => v !== undefined && v !== null)), at: old.at || new Date().toISOString() };
  try { localStorage.setItem(IMPORTS_KEY, JSON.stringify([merged, ...recentImports().filter(x => x.import_id !== r.import_id)].slice(0, 30))); } catch (e) { /* 저장 못 해도 화면은 동작 */ }
  refreshPicker('importId', true);
}
const when = t => t ? String(t).replace('T', ' ').slice(5, 16) : '';   // MM-DD HH:MM
const PICKERS = {
  importId: { list: 'importList', go: () => $('btnImport').click(),
    load: async () => recentImports().map(x => [x.import_id,
      `${x.filename || '-'} · ${x.status || '처리 중'}${x.bundle_id ? ` → ${x.bundle_id}` : ''} · ${when(x.at)}`]) },
  bundleId: { list: 'bundleList', go: () => loadBundle(),
    load: async () => (await api('b', 'GET', '/bundles')).slice().reverse().map(b => [b.bundle_id,
      `${b.status}${NOTE[b.status] ? ` · ${NOTE[b.status]}` : ''} · ${b.model_id} · ${b.list_id} · ${when(b.created_at)}`]) },
  deployId: { list: 'deployList', go: () => $('btnDeploy').click(),
    load: async () => (await api('d', 'GET', '/deployments?limit=50')).map(d => [d.deployment_id,
      `${d.previous_bundle_id} → ${d.bundle_id} · ${d.status}${DEP_NOTE[d.status] ? ` · ${DEP_NOTE[d.status]}` : ''} · ${when(d.created_at)}`]) },
};
const PICKED_AT = {};
async function refreshPicker(id, force = false) {
  if (!force && Date.now() - (PICKED_AT[id] || 0) < 3000) return;   // 칸을 누를 때마다 다시 읽되 3초에 한 번만
  PICKED_AT[id] = Date.now();
  try {
    $(PICKERS[id].list).innerHTML = (await PICKERS[id].load())
      .map(([value, label]) => `<option value="${esc(value)}" label="${esc(label)}"></option>`).join('');
  } catch (e) { /* 목록을 못 읽어도 직접 입력해서 조회할 수 있다 */ }
}
for (const [id, p] of Object.entries(PICKERS)) {
  $(id).addEventListener('focus', () => refreshPicker(id));
  $(id).addEventListener('input', e => {
    // 목록에서 고른 경우만 바로 조회 (직접 치는 중에는 조회하지 않는다: B-1 을 치다 B-10 을 원할 수 있음)
    if (e.inputType && e.inputType !== 'insertReplacementText') return;
    if ([...$(p.list).options].some(o => o.value === $(id).value)) p.go();
  });
  refreshPicker(id, true);
}
</script>
</body>
</html>
