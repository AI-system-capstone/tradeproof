# 클러스터 안에서 부르는 주소 (SCREENING_URL=http://a-screening:8000). stable·canary 구분 없이 Ready 파드 전체.
apiVersion: v1
kind: Service
metadata:
  name: a-screening
  labels:
    app.kubernetes.io/name: a-screening
    app.kubernetes.io/part-of: tradeproof
spec:
  selector:
    app: a-screening
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
# 아래 둘은 selector 가 같지만 Argo Rollouts 가 rollouts-pod-template-hash 를 덧붙여 버전별로 나눈다.
apiVersion: v1
kind: Service
metadata:
  name: a-screening-stable
  labels:
    app.kubernetes.io/part-of: tradeproof
spec:
  selector:
    app: a-screening
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: a-screening-canary
  labels:
    app.kubernetes.io/part-of: tradeproof
spec:
  selector:
    app: a-screening
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
# 바깥 요청 → stable. canary 비율만큼은 Argo 가 만든 canary Ingress 가 가져간다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a-screening
  labels:
    app.kubernetes.io/part-of: tradeproof
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- $hosts := list }}
    {{- if .Values.ingress.host }}{{ $hosts = append $hosts .Values.ingress.host }}{{ end }}
    {{- /* matchAnyHost: 호스트 이름 없는 요청도 받는다 (부하 생성기가 localhost 로 보냄).
           호스트 규칙을 남겨 두는 이유: 호스트 없는 요청은 nginx 기본 서버로 가서 /healthz 를 nginx 가 가로챈다 */}}
    {{- if or .Values.ingress.matchAnyHost (not .Values.ingress.host) }}{{ $hosts = append $hosts "" }}{{ end }}
    {{- range $hosts }}
    - {{- with . }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a-screening-stable
                port:
                  name: http
    {{- end }}
