{{- if .Values.worker.enabled }}
# OCR 워커: 큐(screening_jobs)에서 꺼내 OCR → 판정 → 저장. 포트 없음, BUNDLE_ID 를 읽지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-ocr-worker
  labels:
    app.kubernetes.io/name: a-ocr-worker
    app.kubernetes.io/part-of: tradeproof
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}   {{- /* 자동 확장을 켜면 개수는 HPA 가 정한다 (helm 이 되돌리지 않게 비워 둠) */}}
  selector:
    matchLabels:
      app: a-ocr-worker
  template:
    metadata:
      labels:
        app: a-ocr-worker
        app.kubernetes.io/part-of: tradeproof
    spec:
      containers:
        - name: worker
          image: {{ .Values.worker.image | quote }}
          imagePullPolicy: {{ .Values.worker.imagePullPolicy }}
          {{- with .Values.worker.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.worker.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.worker.envFromSecret }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with .Values.worker.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.worker.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
