{{- $bundle := default .Values.bundle.stable .Values.bundle.candidate -}}
# 심사 API. Deployment 대신 Rollout: 파드 템플릿(BUNDLE_ID)이 바뀌면 canary 단계를 밟는다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: a-screening
  labels:
    app.kubernetes.io/name: a-screening
    app.kubernetes.io/part-of: tradeproof
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: a-screening
  template:
    metadata:
      labels:
        app: a-screening
        app.kubernetes.io/part-of: tradeproof
        tradeproof/bundle-id: {{ $bundle | quote }}   # 번들별 지표 수집(MON-01)에 쓴다
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          {{- with .Values.api.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BUNDLE_ID
              value: {{ $bundle | quote }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.api.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.envFromSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # Ready 가 돼야 canary 가중치가 걸린다 (11/8 에 배운 것)
          readinessProbe:
            httpGet: { path: {{ .Values.api.probePath }}, port: http }
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: {{ default .Values.api.probePath .Values.api.livenessPath }}, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    canary:
      stableService: a-screening-stable
      canaryService: a-screening-canary
      scaleDownDelaySeconds: {{ .Values.canary.scaleDownDelaySeconds }}
      trafficRouting:
        nginx:
          stableIngress: a-screening     # Argo 가 a-screening-a-screening-canary Ingress 를 만들어 가중치를 조절한다
      steps:
        {{- range .Values.canary.weights }}
        - setWeight: {{ . }}
        {{- if $.Values.analysis.enabled }}
        # 이 비율에서 감시가 통과해야 다음 비율로 (templates/analysis.yaml). 시간으로 올라가지 않는다
        - analysis:
            templates:
              - templateName: a-screening-canary
            args:
              - name: candidate
                value: {{ $bundle | quote }}
              - name: stable
                value: {{ $.Values.bundle.stable | quote }}
        {{- else if $.Values.canary.pauseSeconds }}
        - pause: { duration: {{ $.Values.canary.pauseSeconds }}s }
        {{- else }}
        - pause: {}
        {{- end }}
        {{- end }}
