{{- /* BUNDLE_ID 정하기.
      설치할 때: values 의 bundle.candidate (없으면 bundle.stable).
      이미 떠 있을 때: 클러스터의 현재 값을 그대로 둔다 (bundle.keepLive=true, 기본).
        → 번들 교체는 배포 API(D)가 Rollout 을 직접 고쳐서 하므로, 차트를 다시 적용해도 canary 가 시작되지 않는다.
      helm template / --dry-run 에서는 lookup 이 비어 있어 values 값이 나온다. */ -}}
{{- $bundle := default .Values.bundle.stable .Values.bundle.candidate -}}
{{- if .Values.bundle.keepLive -}}
{{- $live := lookup "argoproj.io/v1alpha1" "Rollout" .Release.Namespace "a-screening" -}}
{{- if $live -}}
{{- range (index $live.spec.template.spec.containers 0).env -}}
{{- if eq .name "BUNDLE_ID" -}}{{- $bundle = .value -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
# 심사 API. Deployment 대신 Rollout: 파드 템플릿(BUNDLE_ID)이 바뀌면 canary 단계를 밟는다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: a-screening
  labels:
    app.kubernetes.io/name: a-screening
    app.kubernetes.io/part-of: tradeproof
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 5
  # 최근 버전으로 되돌릴 때는 canary 단계를 건너뛰고 바로 전환한다 (롤백은 빨라야 한다, DEP-05)
  rollbackWindow:
    revisions: {{ .Values.canary.rollbackWindowRevisions }}
  selector:
    matchLabels:
      app: a-screening
  template:
    metadata:
      labels:
        app: a-screening
        app.kubernetes.io/part-of: tradeproof
        tradeproof/bundle-id: {{ $bundle | quote }}   # 번들별 지표 수집(MON-01)에 쓴다
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          {{- with .Values.api.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # 배포 API 가 이 값을 고친다. **첫 번째 컨테이너의 첫 번째 env 로 둘 것** (JSON patch 경로가 고정)
            - name: BUNDLE_ID
              value: {{ $bundle | quote }}
          {{- if .Values.api.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.envFromSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # Ready 가 돼야 canary 가중치가 걸린다 (11/8 에 배운 것)
          readinessProbe:
            httpGet: { path: {{ .Values.api.probePath }}, port: http }
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: {{ .Values.api.probePath }}, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
  strategy:
    canary:
      stableService: a-screening-stable
      canaryService: a-screening-canary
      scaleDownDelaySeconds: {{ .Values.canary.scaleDownDelaySeconds }}
      trafficRouting:
        nginx:
          stableIngress: a-screening     # Argo 가 a-screening-a-screening-canary Ingress 를 만들어 가중치를 조절한다
      steps:
        {{- range .Values.canary.weights }}
        - setWeight: {{ . }}
        {{- if $.Values.canary.pauseSeconds }}
        - pause: { duration: {{ $.Values.canary.pauseSeconds }}s }
        {{- else }}
        - pause: {}
        {{- end }}
        {{- end }}
