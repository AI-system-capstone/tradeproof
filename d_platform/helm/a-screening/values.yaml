# 심사 서비스(A) 차트 기본값 (담당: D)
#
#   helm upgrade --install a-screening d_platform/helm/a-screening -n tradeproof -f deploy/values-dev.yaml
#
# 번들 교체 = BUNDLE_ID 환경변수 변경. 파드 템플릿이 바뀌므로 Argo Rollouts 가 canary 를 시작한다.
#   BUNDLE_ID = bundle.candidate 가 있으면 candidate, 없으면 stable
#   - 새 번들 반영 시작: candidate 에 새 번들 ID 를 적고 helm upgrade  → canary 시작
#   - 100% 반영 후:      stable 을 그 번들로, candidate 를 "" 로 고쳐도 BUNDLE_ID 는 그대로라 아무 일도 없다

# deploy/values-dev.yaml 이 덮어쓴다 (D 의 배포 API 가 쓰고 적용)
bundle:
  stable: B-7        # common/contracts.py 의 BASELINE_BUNDLE
  candidate: ""

api:
  # A 심사 API 이미지 (11/17 A 지윤아). k3s 에 넣는 법:
  #   docker build -f a_screening/Dockerfile --target screening-api -t tradeproof/a-screening:dev .
  #   docker save tradeproof/a-screening:dev | sudo k3s ctr images import -
  # 더미로 canary 뼈대만 볼 때는 image: hashicorp/http-echo:0.2.3, args: ["-text=$(BUNDLE_ID)", "-listen=:8000"],
  #   probePath·livenessPath: /, envFromSecret: "" 로 되돌리면 된다.
  image: tradeproof/a-screening:dev
  imagePullPolicy: Never
  args: []
  port: 8000
  replicas: 2
  probePath: /healthz      # readiness: DB·원문 저장소·번들(B 레지스트리) 중 하나라도 안 되면 503 → 트래픽을 받지 않는다
  livenessPath: /livez     # liveness: 프로세스만 확인 (B·DB 장애로 파드를 재시작하지 않도록)
  envFromSecret: tradeproof-env    # DATABASE_URL, BLOB_*, REGISTRY_URL (scripts/k3s_data_up.sh 가 .env.example 로 만듦)
  env:
    REGISTRY_MODE: http    # 번들 구성·모델 설정·제재 리스트를 B 의 GET /bundles/{id} 와 원본 ZIP 에서 받는다 (a_screening/registry.py)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }   # 측정: 리스트 2개 적재 후 약 45MB

# OCR 워커. 번들은 접수 때 거래마다 고정되고 워커는 그 거래의 번들로 처리하므로(A 제안) 워커는 하나만 둔다.
# 포트가 없어 canary 대상이 아니다.
#   docker build -f a_screening/Dockerfile --target ocr-worker -t tradeproof/a-ocr-worker:dev .
#   docker save tradeproof/a-ocr-worker:dev | sudo k3s ctr images import -
worker:
  enabled: true
  image: tradeproof/a-ocr-worker:dev
  imagePullPolicy: Never
  replicas: 1
  envFromSecret: tradeproof-env
  env:
    REGISTRY_MODE: http
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }   # 측정: 한 건 처리 시 약 115MB + tesseract

ingress:
  className: nginx
  host: tradeproof.local

canary:
  # 단계마다 이 비율로 올린 뒤 멈춘다. 마지막 단계를 넘기면 100%.  (MTG-05 제안: 10 → 50 → 100)
  weights: [10, 50]
  # 0 이면 사람이 승격할 때까지 멈춘다 (kubectl argo rollouts promote a-screening -n tradeproof).
  # 초를 적으면 그 시간 뒤 자동으로 다음 단계. 감시(AnalysisTemplate)는 다음 단계에서 붙인다.
  pauseSeconds: 0
  # 옛 버전 파드를 내리기 전 기다리는 시간. 이 안에 undo 하면 옛 ReplicaSet 을 그대로 다시 쓴다.
  scaleDownDelaySeconds: 30
