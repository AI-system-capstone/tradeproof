# Prometheus (MON-01): canary 감시(A 차트 analysis)가 읽을 운영 지표를 모은다. 네임스페이스 tradeproof.
#   kubectl apply -f d_platform/k8s/monitoring/prometheus.yaml
# A 심사 API 의 /metrics 는 DB 전체를 번들별(bundle_id 라벨)로 집계하므로 파드 하나만 긁어도 된다 → Service 로 수집.
# 시연용이라 데이터는 파드 안(emptyDir)에만 두고 하루만 보관한다.
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: tradeproof }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: a-screening           # 번들별 처리 시간·실패·판정·OCR 신뢰도
        static_configs: [{ targets: ["a-screening-stable:8000"] }]
      - job_name: d-platform            # 배포 상태·롤백 수
        static_configs: [{ targets: ["d-platform:8300"] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: tradeproof, labels: { app.kubernetes.io/part-of: tradeproof } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus, app.kubernetes.io/part-of: tradeproof } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: tradeproof }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: http }]
