# 시연 키트용 A 차트 추가 값 (scripts/demo_up.sh·demo_reset.sh 가 helm 에, D 배포 API 가 HELM_VALUES_FILES 로 넣는다)

# canary 감시 켜기 (Prometheus: d_platform/k8s/monitoring/prometheus.yaml)
analysis:
  enabled: true

# 호스트 이름 없이도 canary 입구가 받게 (scripts/demo_traffic.sh 의 부하 생성기가 localhost:8081 로 보냄).
# Host: tradeproof.local 규칙도 남는다 → curl -H 'Host: tradeproof.local' localhost:8081/healthz 는 그대로 된다
ingress:
  matchAnyHost: true

# 샘플 서류(data/docs)를 A 심사 API·워커에 읽기 전용으로 붙인다 → 검토 화면의 "샘플 ID로 접수"(sample_tx_id)가 된다.
# 노드의 /data/tradeproof 는 저장소의 data/ 폴더다 (k3d: 클러스터를 만들 때 -v 로 붙임).
api:
  volumes:
    - name: docs
      hostPath: { path: /data/tradeproof/docs, type: Directory }
  volumeMounts:
    - { name: docs, mountPath: /app/data/docs, readOnly: true }
worker:
  volumes:
    - name: docs
      hostPath: { path: /data/tradeproof/docs, type: Directory }
  volumeMounts:
    - { name: docs, mountPath: /app/data/docs, readOnly: true }
