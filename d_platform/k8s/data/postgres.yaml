# Postgres (시연 환경). 서비스 이름 postgres:5432 는 compose 와 같다 → DATABASE_URL 을 그대로 쓴다.
# 스키마: ConfigMap pg-schema (common/schema/*.sql, scripts/k3s_data_up.sh 가 만든다)를
#         /docker-entrypoint-initdb.d 에 넣어 **데이터 폴더가 비어 있을 때 한 번만** 파일 이름 순서로 적용한다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/part-of: tradeproof }
spec:
  selector: { app: postgres }
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/part-of: tradeproof }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, app.kubernetes.io/part-of: tradeproof }
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: tradeproof-env, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: tradeproof-env, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: tradeproof-env, key: POSTGRES_DB } } }
            # PVC 루트에는 lost+found 가 있을 수 있어 하위 폴더를 데이터 폴더로 쓴다
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
            failureThreshold: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: schema
          configMap: { name: pg-schema }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 1Gi }
