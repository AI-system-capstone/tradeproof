# D 배포 API 를 클러스터 안에서 띄운다 (argo 드라이버). 네임스페이스 tradeproof.
#   kubectl -n tradeproof create configmap d-platform-helm-values --from-file=a-screening-values.yaml=<A 차트 추가 값>
#   kubectl apply -f d_platform/k8s/platform/d-platform.yaml
# B·C 는 http://d-platform:8300 으로 부른다.
#
# 이미지(tradeproof/d-platform:dev)에 helm·kubectl·Argo Rollouts 플러그인과 A 차트가 들어 있다 (d_platform/Dockerfile).
# 배포 API 는 A 릴리스(a-screening)를 helm upgrade 하고 Rollout 을 abort·promote 하므로 아래 권한이 필요하다.
#   - Helm: 릴리스 기록(Secret sh.helm.release.*)과 차트가 만드는 Service·Ingress·Deployment(워커)·Rollout
#   - Argo Rollouts 플러그인: Rollout 조회·abort(status 패치)·promote
# 번들 값 파일(deploy/values-dev.yaml 자리)은 emptyDir 에 둔다. 배포 API 는 배포 시작·완료·롤백 때마다 파일 전체를
# 다시 쓰므로 파드가 재시작돼도 다음 동작에 문제가 없다. 배포 이력은 Postgres 의 deployments 표가 기준이다.
apiVersion: v1
kind: ServiceAccount
metadata: { name: d-platform, namespace: tradeproof }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: d-platform-deployer, namespace: tradeproof }
rules:
  - apiGroups: [""]
    resources: ["secrets", "services"]          # secrets: helm 릴리스 기록
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]                  # A OCR 워커
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]     # A 차트의 OCR 워커 자동 확장
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status", "rollouts/scale", "analysistemplates"]   # analysistemplates: A 차트의 canary 감시
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns"]                 # 중단 사유를 볼 때 (읽기만)
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: d-platform-deployer, namespace: tradeproof }
subjects: [{ kind: ServiceAccount, name: d-platform, namespace: tradeproof }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: d-platform-deployer }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: d-platform, namespace: tradeproof, labels: { app.kubernetes.io/part-of: tradeproof } }
spec:
  replicas: 1                     # 배포는 한 번에 하나. 두 개가 동시에 helm 을 부르지 않게
  strategy: { type: Recreate }
  selector: { matchLabels: { app: d-platform } }
  template:
    metadata: { labels: { app: d-platform, app.kubernetes.io/part-of: tradeproof } }
    spec:
      serviceAccountName: d-platform
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: d-platform
          image: tradeproof/d-platform:dev
          imagePullPolicy: Never
          envFrom: [{ secretRef: { name: tradeproof-env } }]    # DATABASE_URL, REGISTRY_URL, BUNDLE_ID(최초 번들)
          env:
            - { name: DEPLOY_DRIVER, value: argo }
            - { name: REGISTRY_MODE, value: http }               # 공용 Secret 에는 넣지 않는다 (A 도 같은 이름을 씀)
            - { name: CANARY_PAUSE_SECONDS, value: "30" }        # A 차트 감시를 끈 경우에만 쓴다 (켜면 감시 통과로 다음 비율)
            - { name: RECONCILE_SECONDS, value: "5" }           # 감시가 canary 를 중단하면 화면을 안 열어 둬도 5초 안에 롤백
            - { name: HELM_BUNDLE_VALUES, value: /var/lib/d-platform/values-bundle.yaml }
            - { name: HELM_VALUES_FILES, value: /etc/d-platform/a-screening-values.yaml }
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports: [{ name: http, containerPort: 8300 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }                            # helm 이 차트를 렌더링할 때 잠깐 늘어난다
          volumeMounts:
            - { name: state, mountPath: /var/lib/d-platform }
            - { name: helm-values, mountPath: /etc/d-platform, readOnly: true }
      volumes:
        - { name: state, emptyDir: {} }
        - { name: helm-values, configMap: { name: d-platform-helm-values } }
---
apiVersion: v1
kind: Service
metadata: { name: d-platform, namespace: tradeproof }
spec:
  selector: { app: d-platform }
  ports: [{ port: 8300, targetPort: http }]
